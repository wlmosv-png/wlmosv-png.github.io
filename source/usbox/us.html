<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>只属于我们 · 记录墙</title>
<style>
/* ===== 玻璃信笺风 · 蜜桃×淡紫 ===== */
:root{
  --pp:#ff5c9c; --pp2:#ff9dbe; --ppSoft:rgba(255,92,156,.13);
  --yy:#8f6fe8; --yy2:#b9a3f2; --yySoft:rgba(143,111,232,.13);
  --ink:#4a3548; --ink2:#9c88a5; --ink3:#c9b8cf;
  --gold:#f6c453; --goldSoft:rgba(246,196,83,.35);
  --glass:rgba(255,255,255,.66); --glass2:rgba(255,255,255,.42);
  --line:rgba(150,120,180,.16);
  --r:22px;
  --shadow:0 14px 40px rgba(190,120,175,.16);
  --shadow2:0 4px 14px rgba(190,120,175,.12);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:
    radial-gradient(900px 520px at 88% -8%, rgba(255,168,214,.55), transparent 62%),
    radial-gradient(760px 520px at -12% 26%, rgba(186,156,255,.45), transparent 58%),
    radial-gradient(680px 480px at 58% 112%, rgba(255,212,156,.4), transparent 60%),
    linear-gradient(168deg,#fff2f7 0%,#fdf3ff 52%,#fff6ec 100%);
  background-attachment:fixed;
  color:var(--ink);
  font-family:"PingFang SC","HarmonyOS Sans SC","Noto Sans CJK SC",sans-serif;
  min-height:100vh;overflow-x:hidden;
}
/* 背景漂浮光斑 */
#orbs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#orbs i{position:absolute;border-radius:50%;filter:blur(46px);opacity:.5;animation:drift 16s ease-in-out infinite alternate}
#orbs i:nth-child(1){width:280px;height:280px;left:-60px;top:8%;background:#ffc3dd}
#orbs i:nth-child(2){width:240px;height:240px;right:-50px;top:34%;background:#cdb9ff;animation-delay:-5s}
#orbs i:nth-child(3){width:200px;height:200px;left:22%;bottom:-60px;background:#ffdfb8;animation-delay:-9s}
#orbs i:nth-child(4){width:150px;height:150px;right:16%;bottom:18%;background:#ffd6ec;animation-delay:-12s}
@keyframes drift{
  0%{transform:translate(0,0) scale(1)}
  100%{transform:translate(34px,-40px) scale(1.12)}
}
/* 星星点缀 */
#stars{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#stars i{position:absolute;font-size:11px;opacity:.35;animation:twinkle 3.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.22;transform:scale(.9)}50%{opacity:.55;transform:scale(1.08)}}

/* ===== 锁屏 ===== */
#lock{
  position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(170deg,#ffe7f1 0%,#ffd7ea 40%,#efe0ff 78%,#fde8f4 100%);
  transition:opacity .5s ease;overflow:hidden;
}
#lock.hidden{opacity:0;pointer-events:none}
#lockGlow{position:absolute;width:520px;height:520px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,255,255,.5),rgba(255,170,210,.18) 45%,transparent 70%);
  animation:glowPulse 5s ease-in-out infinite}
@keyframes glowPulse{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
#hearts{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#hearts i{position:absolute;bottom:-40px;font-style:normal;animation:floatUp linear infinite;opacity:.45}
@keyframes floatUp{
  0%{transform:translateY(0) rotate(0);opacity:0}
  12%{opacity:.6}
  100%{transform:translateY(-112vh) rotate(340deg);opacity:0}
}
#lockLogo{
  width:116px;height:116px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;
  background:linear-gradient(140deg,#ff9dbe,#ff4f94 70%,#f5428d);
  font-size:50px;color:#fff;cursor:pointer;user-select:none;touch-action:none;-webkit-touch-callout:none;
  box-shadow:0 14px 44px rgba(255,80,150,.5), inset 0 -8px 16px rgba(190,40,100,.3), inset 0 3px 8px rgba(255,255,255,.45);
  animation:breathe 3s ease-in-out infinite;
}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
#lockLogo::before{content:"";position:absolute;inset:-16px;border-radius:50%;
  background:conic-gradient(from 0deg,rgba(255,255,255,.55),rgba(255,255,255,.08) 40%,rgba(255,255,255,.55));
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 2px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 2px));
  animation:spin 12s linear infinite}
#lockLogo::after{content:"";position:absolute;inset:-34px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,150,190,.35),transparent 66%);
  filter:blur(10px);z-index:-1;animation:breathe 3s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#lockLogo:active{transform:scale(.93);animation:none}
#lockTitle{margin-top:30px;font-size:24px;font-weight:800;color:#c1487f;letter-spacing:4px}
#lockTitle i{font-style:normal;font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:16px;
  letter-spacing:5px;color:#e08db2;display:block;margin-top:7px;text-transform:uppercase}
#lockHint{font-size:13px;color:#d08fae;margin-top:20px;letter-spacing:2px}
#cloudLink{
  position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:16px;z-index:3;
  font-size:12px;color:#c98aa6;padding:7px 15px;border:1px solid rgba(255,255,255,.8);
  border-radius:999px;cursor:pointer;background:rgba(255,255,255,.5);backdrop-filter:blur(10px);
}
#pwdBox{
  display:none;margin-top:24px;text-align:center;width:min(300px,86vw);
  animation:rise .35s cubic-bezier(.2,.9,.3,1.2);
}
#pwdBox.show{display:block}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
#pwdBox input{
  width:100%;padding:14px 18px;border-radius:999px;border:2px solid rgba(255,140,185,.55);
  background:rgba(255,255,255,.88);color:#c1487f;font-size:16px;text-align:center;outline:none;
  letter-spacing:3px;box-shadow:var(--shadow2);transition:border-color .2s, box-shadow .2s;
}
#pwdBox input:focus{border-color:var(--pp);box-shadow:0 0 0 5px rgba(255,92,156,.15)}
#pwdBtns{display:flex;gap:12px;justify-content:center;margin-top:18px}
.btn{
  padding:12px 28px;border-radius:999px;border:none;font-size:14px;cursor:pointer;letter-spacing:2px;
  background:rgba(255,255,255,.85);color:#c98aa6;transition:all .2s;box-shadow:var(--shadow2);
}
.btn:active{transform:scale(.94)}
.btn.primary{background:linear-gradient(140deg,#ff9dbe,#ff4f94);color:#fff;font-weight:600;
  box-shadow:0 8px 22px rgba(255,80,150,.42)}
#pwdErr{font-size:12px;color:#e05d7f;margin-top:14px;min-height:16px;display:none}
</style>
</head>
<style>
/* ===== 主界面 ===== */
#app{display:none;max-width:620px;margin:0 auto;padding:0 12px 130px;position:relative;z-index:2}
#app.show{display:block}
#topbar{
  position:sticky;top:0;z-index:20;padding:14px 6px 10px;
  background:linear-gradient(180deg,rgba(255,247,251,.9) 66%,rgba(255,247,251,0));
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
#brand{display:flex;align-items:center;gap:10px}
#brand .mark{
  width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;
  background:linear-gradient(140deg,#ff9dbe,#ff4f94);color:#fff;font-size:18px;
  box-shadow:0 6px 16px rgba(255,80,150,.4);
}
#brand .mark::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px dashed rgba(255,120,170,.5);animation:spin 16s linear infinite}
#brand h1{font-size:17px;font-weight:800;color:#c1487f;letter-spacing:2px;line-height:1.3}
#brand h1 small{display:block;font-size:9.5px;font-weight:400;color:var(--ink3);letter-spacing:4px;margin-top:2px}
#whoBox{display:flex;gap:3px;background:rgba(255,255,255,.7);padding:4px;border-radius:999px;
  box-shadow:var(--shadow2);border:1px solid rgba(255,255,255,.8)}
#whoBox .who{
  padding:7px 17px;border-radius:999px;cursor:pointer;color:var(--ink2);font-size:14px;font-weight:600;
  transition:all .25s;user-select:none;letter-spacing:1px;
}
#whoBox .who.on{color:#fff;font-weight:800;transform:scale(1.04)}
#whoBox .who.on[data-who="me"]{background:linear-gradient(140deg,#ff8fb8,#ff4f94);box-shadow:0 4px 12px rgba(255,80,150,.4)}
#whoBox .who.on[data-who="you"]{background:linear-gradient(140deg,#a88bf0,#7d5ce0);box-shadow:0 4px 12px rgba(125,92,224,.4)}
/* 时段问候 */
#hello{text-align:center;font-size:12px;color:var(--ink2);letter-spacing:2px;margin:8px 0 2px}
#hello b{font-weight:700}
/* 日期分隔：毛玻璃药丸 */
.daytag{display:flex;justify-content:center;margin:26px 0 14px}
.daytag b{
  font-size:11.5px;font-weight:600;color:var(--ink2);letter-spacing:2px;padding:6px 18px;border-radius:999px;
  background:rgba(255,255,255,.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.85);box-shadow:var(--shadow2);
}
/* ===== 消息气泡：玻璃卡 + 头像徽章 ===== */
#list{display:flex;flex-direction:column;gap:16px;margin-top:4px}
.msg{display:flex;gap:9px;align-items:flex-end;animation:popIn .38s cubic-bezier(.2,.9,.3,1.15) both}
@keyframes popIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
.msg.me{flex-direction:row-reverse}
.ava{
  flex:none;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:800;color:#fff;letter-spacing:0;position:relative;
  box-shadow:0 4px 12px rgba(160,100,150,.3);
}
.msg.me .ava{background:linear-gradient(140deg,#ff9dbe,#ff4f94)}
.msg.you .ava{background:linear-gradient(140deg,#a88bf0,#7d5ce0)}
.ava::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:1.5px solid rgba(255,255,255,.85)}
.bubble{
  position:relative;max-width:78%;padding:12px 16px;border-radius:20px;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.8);
  box-shadow:0 10px 28px rgba(180,110,170,.14), inset 0 1px 0 rgba(255,255,255,.9);
}
.msg.me .bubble{
  background:linear-gradient(150deg,rgba(255,232,242,.92),rgba(255,214,232,.88));
  border-top-right-radius:8px;
}
.msg.you .bubble{
  background:linear-gradient(150deg,rgba(241,234,255,.92),rgba(228,216,252,.9));
  border-top-left-radius:8px;
}
.bubble .meta{font-size:11px;color:var(--ink3);margin-bottom:6px;display:flex;align-items:center;gap:7px}
.bubble .meta b{font-weight:800;letter-spacing:1px;font-size:11.5px}
.msg.me .meta b{color:var(--pp)} .msg.you .meta b{color:var(--yy)}
.bubble .txt{font-size:15px;line-height:1.75;word-break:break-word;white-space:pre-wrap;color:var(--ink)}
.bubble img{max-width:100%;border-radius:14px;display:block;margin-top:3px;box-shadow:var(--shadow)}
.bubble .imgTag{font-size:11px;color:var(--ink3);margin-top:7px;letter-spacing:1px}
/* 表情反应 */
.rx{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.rx .rxb{
  display:flex;align-items:center;gap:4px;padding:5px 12px;border-radius:999px;
  background:rgba(255,255,255,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.9);font-size:14px;color:var(--ink2);
  cursor:pointer;transition:transform .18s, background .2s;user-select:none;box-shadow:var(--shadow2);
}
.rx .rxb:active{transform:scale(.82)}
.rx .rxb.hot{background:#fff;color:var(--ink);box-shadow:0 4px 14px rgba(255,80,150,.25);border-color:var(--ppSoft)}
.rx .rxb b{font-size:12px;min-width:10px;color:var(--pp);font-weight:800}
/* 输入区：毛玻璃 */
#composer{
  position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:620px;margin:0 auto;
  padding:10px 14px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(0deg,rgba(255,247,251,.92) 70%,rgba(255,247,251,0));
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  display:flex;gap:9px;align-items:flex-end;
}
#composer textarea{
  flex:1;resize:none;max-height:100px;padding:13px 18px;border-radius:22px;
  border:2px solid rgba(255,150,195,.5);background:rgba(255,255,255,.88);
  color:var(--ink);font-size:15px;line-height:1.45;outline:none;font-family:inherit;
  box-shadow:var(--shadow2);transition:border-color .2s, box-shadow .2s;
}
#composer textarea:focus{border-color:var(--pp);box-shadow:0 0 0 5px rgba(255,92,156,.14)}
#composer .icon{
  flex:none;width:46px;height:46px;border-radius:50%;border:none;font-size:20px;cursor:pointer;
  background:linear-gradient(140deg,#ffe4f0,#ffc9de);display:flex;align-items:center;justify-content:center;
  transition:all .2s;color:#c1487f;box-shadow:var(--shadow2);
}
#composer .icon:active{transform:scale(.86) rotate(-12deg)}
#composer .send{
  flex:none;width:46px;height:46px;border-radius:50%;border:none;font-size:17px;cursor:pointer;
  background:linear-gradient(140deg,#ff8fb8,#ff4f94);color:#fff;display:flex;align-items:center;justify-content:center;
  transition:all .2s;box-shadow:0 6px 18px rgba(255,80,150,.42);
}
#composer .send:active{transform:scale(.86)}
#pending{font-size:12px;color:var(--pp);text-align:center;padding:6px 0}
#photoPrev{display:none;margin:10px 0 4px;border-radius:16px;overflow:hidden;max-width:200px;position:relative;box-shadow:var(--shadow)}
#photoPrev.show{display:block}
#photoPrev img{width:100%;display:block}
#photoPrev .x{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:rgba(180,60,100,.75);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer}
/* 空状态 */
#empty{display:none;text-align:center;padding:80px 0 40px;color:var(--ink3)}
#empty.show{display:block}
#empty .big{font-size:56px;margin-bottom:18px;animation:breathe 3.2s ease-in-out infinite;filter:drop-shadow(0 6px 18px rgba(255,110,160,.35))}
#empty .t{font-size:15px;color:var(--ink2);letter-spacing:2px;line-height:2}
#empty .t i{font-style:normal;font-family:Georgia,serif;font-size:12px;letter-spacing:3px;color:var(--ink3)}
</style>
</head>

<script>
(function(){
'use strict';
var LS_KEY = 'usbox.v1';
var LS_WHO = 'usbox.who';
var CLOUD = true;
var store = {
  load: function(){
    var local = null;
    try { var s = localStorage.getItem(LS_KEY); local = s ? JSON.parse(s) : null; } catch(e){ local = null; }
    if (!CLOUD || !UsCloud.hasToken()) return local;
    return UsCloud.load().then(function(cloud){
      if (cloud) { localStorage.setItem(LS_KEY, JSON.stringify(cloud)); return cloud; }
      return local;
    }).catch(function(){ return local; });
  },
  save: function(blob){
    localStorage.setItem(LS_KEY, JSON.stringify(blob));
    if (!CLOUD || !UsCloud.hasToken()) return Promise.resolve();
    return UsCloud.getFile().then(function(f){
      return UsCloud.save(blob, f.sha);
    }).catch(function(){});
  },
};

var state = { blob: null, msgs: [], who: localStorage.getItem(LS_WHO) || 'me', pwd: null };
var NAMES = { me: 'PP', you: 'YY' };

var $ = function(id){ return document.getElementById(id); };
var lock = $('lock'), lockLogo = $('lockLogo'), lockHint = $('lockHint'), pwdBox = $('pwdBox'),
    pwd = $('pwd'), pwdOk = $('pwdOk'), pwdCancel = $('pwdCancel'), pwdErr = $('pwdErr'),
    app = $('app'), list = $('list'), empty = $('empty'), pending = $('pending'),
    composer = $('composer'), input = $('input'), btnSend = $('btnSend'), btnPhoto = $('btnPhoto'),
    file = $('file'), photoPrev = $('photoPrev'), photoPrevImg = $('photoPrevImg'), photoPrevX = $('photoPrevX'),
    hello = $('hello');

var EMOS = [['\u2764\ufe0f','heart'],['\u263a\ufe0f','smile'],['\ud83d\ude02','laugh'],['\ud83d\ude2d','cry']];

/* ===== 漂浮小爱心 ===== */
(function(){
  var box = $('hearts'), marks = ['💗','💕','💖','🌸','✨','💞','🌷','🩷','💫'];
  for (var i = 0; i < 14; i++){
    var el = document.createElement('i');
    el.textContent = marks[i % marks.length];
    el.style.left = (3 + Math.random() * 94) + '%';
    el.style.fontSize = (12 + Math.random() * 17) + 'px';
    el.style.animationDuration = (8 + Math.random() * 9) + 's';
    el.style.animationDelay = (-Math.random() * 13) + 's';
    box.appendChild(el);
  }
})();

/* ===== 星星点缀 ===== */
(function(){
  var box = $('stars'), n = 16;
  for (var i = 0; i < n; i++){
    var el = document.createElement('i');
    el.textContent = ['✦','✧','·'][i % 3];
    el.style.left = (Math.random() * 98) + '%';
    el.style.top = (Math.random() * 98) + '%';
    el.style.animationDelay = (-Math.random() * 4) + 's';
    box.appendChild(el);
  }
})();

/* ===== 时段问候 ===== */
(function(){
  var h = new Date().getHours(), t = '';
  if (h >= 5 && h < 9) t = '早安呀，今天也是想你的一天 🌅';
  else if (h >= 9 && h < 12) t = '上午好，偷偷想你一下 ☀️';
  else if (h >= 12 && h < 14) t = '午安，记得好好吃饭 🍚';
  else if (h >= 14 && h < 18) t = '下午好，心里的小鹿又开始蹦跶 🍵';
  else if (h >= 18 && h < 22) t = '晚上好，今天的想念也在营业 🌙';
  else t = '夜深了，还在想你呢 💤';
  hello.innerHTML = '<b>' + t + '</b>';
})();

/* ===== 照片压缩 ===== */
function compressPhoto(file, cb){
  var reader = new FileReader();
  reader.onload = function(e){
    var img = new Image();
    img.onload = function(){
      var MAX = 900, w = img.width, h = img.height;
      if (w > MAX || h > MAX) {
        var r = Math.min(MAX / w, MAX / h);
        w = Math.round(w * r); h = Math.round(h * r);
      }
      var cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      var ctx = cv.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      cb(cv.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = function(){ cb(null); };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ===== 渲染 ===== */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function pad(n){ return (n<10?'0':'')+n; }
function dayKey(ts){ var d = new Date(ts); return d.getFullYear()+'/'+d.getMonth()+'/'+d.getDate(); }
function dayLabel(ts){
  var d = new Date(ts), now = new Date();
  var tk = dayKey(ts), nk = dayKey(now.getTime()), yk = dayKey(now.getTime() - 864e5);
  if (tk === nk) return '今天';
  if (tk === yk) return '昨天';
  return (d.getMonth()+1)+'月'+d.getDate()+'日';
}
function fmtTime(ts){
  var d = new Date(ts);
  return pad(d.getHours())+':'+pad(d.getMinutes());
}
function render(){
  list.innerHTML = '';
  if (!state.msgs.length) { empty.className = 'show'; return; }
  empty.className = '';
  var last = null, idx = 0;
  state.msgs.slice().reverse().forEach(function(m){
    var k = dayKey(m.ts);
    if (k !== last) {
      last = k;
      var dt = document.createElement('div');
      dt.className = 'daytag';
      dt.style.animation = 'popIn .35s ease both';
      dt.innerHTML = '<b>'+dayLabel(m.ts)+'</b>';
      list.appendChild(dt);
    }
    var el = document.createElement('div');
    el.className = 'msg ' + (m.who === state.who ? 'me' : 'you');
    el.style.animationDelay = Math.min(idx * 45, 320) + 'ms';
    var ava = (m.who === 'me' ? 'PP' : 'YY');
    var html = '<span class="ava">' + ava + '</span>';
    html += '<div class="bubble">';
    html += '<div class="meta"><b>' + NAMES[m.who] + '</b>' + fmtTime(m.ts) + '</div>';
    if (m.type === 'photo') {
      html += '<img src="' + m.photo + '" alt="照片" loading="lazy">';
      html += '<div class="imgTag">📸 一张照片</div>';
    }
    if (m.text) html += '<div class="txt">' + esc(m.text) + '</div>';
    html += '<div class="rx">';
    EMOS.forEach(function(e){
      var n = (m.rx && m.rx[e[1]]) || 0;
      html += '<span class="rxb' + (n?' hot':'') + '" data-id="' + m.id + '" data-emo="' + e[1] + '">' + e[0] + (n?'<b>'+n+'</b>':'') + '</span>';
    });
    html += '</div></div>';
    el.innerHTML = html;
    list.appendChild(el);
    idx++;
  });
}

/* ===== 加密读写 ===== */
async function saveData(){
  var blob = await UsCrypto.encryptObject(state.pwd, { msgs: state.msgs });
  await store.save(blob);
  state.blob = blob;
}
async function loadData(){
  var blob = await store.load();
  if (!blob) return null;
  try {
    var obj = await UsCrypto.decryptObject(state.pwd, blob);
    state.msgs = (obj && obj.msgs) || [];
    state.blob = blob;
    return true;
  } catch(e) { return false; }
}

/* ===== 解锁 ===== */
lockLogo.addEventListener('click', openPwdBox);
function openPwdBox(){
  pwdBox.className = 'show';
  lockHint.style.display = 'none';
  pwdErr.style.display = 'none';
  pwd.value = '';
  setTimeout(function(){ pwd.focus(); }, 130);
}
async function unlock(){
  var v = pwd.value.trim();
  if (!v) return;
  state.pwd = v;
  var ok = await loadData();
  if (ok === false) {
    pwdErr.style.display = 'block';
    state.pwd = null;
    return;
  }
  if (ok === null) {
    state.msgs = [];
    await saveData();
  }
  enter();
}
function enter(){
  lock.className = 'hidden';
  app.className = 'show';
  composer.style.display = 'flex';
  document.body.style.overflow = 'auto';
  setWho(state.who);
  render();
  setTimeout(function(){ input.focus(); }, 260);
}
pwdOk.addEventListener('click', unlock);
pwdCancel.addEventListener('click', function(){
  pwdBox.className = ''; pwd.value = '';
  lockHint.style.display = '';
  pwdErr.style.display = 'none';
});
pwd.addEventListener('keydown', function(e){ if (e.key === 'Enter') unlock(); });

/* ===== 云端连接 ===== */
document.getElementById('cloudLink').addEventListener('click', function(){
  if (UsCloud.hasToken()) {
    if (!confirm('已连接云端。\n要更换访问令牌吗？')) return;
  }
  var t = prompt('粘贴你的 GitHub 访问令牌（两人用同一个）。\n未配置时只能在本机查看。', UsCloud.token() || '');
  if (t === null) return;
  if (UsCloud.saveToken(t)) {
    alert('✓ 云端已连接');
  } else {
    alert('令牌已清除（仅本机）。');
  }
});

/* ===== 身份切换 ===== */
function setWho(w){
  state.who = w;
  localStorage.setItem(LS_WHO, w);
  document.querySelectorAll('.who').forEach(function(el){
    el.className = 'who' + (el.getAttribute('data-who') === w ? ' on' : '');
  });
  render();
}
document.querySelector('#whoBox').addEventListener('click', function(e){
  var w = e.target.getAttribute && e.target.getAttribute('data-who');
  if (w) setWho(w);
});

/* ===== 发送 ===== */
function sendMsg(type, text, photo){
  var m = { id: Date.now(), ts: Date.now(), who: state.who, type: type, rx: {} };
  if (text) m.text = text;
  if (photo) m.photo = photo;
  state.msgs.push(m);
  saveData().then(function(){
    render();
    pending.textContent = '';
  });
  pending.textContent = type === 'photo' ? '照片加密上传中…' : '加密保存中…';
}
function doSend(){
  var v = input.value.trim();
  if (v) {
    sendMsg('text', v);
    input.value = '';
    input.style.height = 'auto';
  }
  if (pendingPhoto) {
    sendMsg('photo', '', pendingPhoto);
    pendingPhoto = null;
    photoPrev.className = '';
    photoPrevImg.src = '';
  }
  input.focus();
}
btnSend.addEventListener('click', doSend);
input.addEventListener('keydown', function(e){
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); }
});
input.addEventListener('input', function(){
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 100) + 'px';
});

/* ===== 照片 ===== */
var pendingPhoto = null;
btnPhoto.addEventListener('click', function(){ file.click(); });
file.addEventListener('change', function(){
  var f = file.files[0];
  if (!f) return;
  compressPhoto(f, function(data){
    file.value = '';
    if (!data) { pending.textContent = '照片处理失败'; return; }
    pendingPhoto = data;
    photoPrevImg.src = data;
    photoPrev.className = 'show';
    pending.textContent = '';
  });
});
photoPrevX.addEventListener('click', function(){
  pendingPhoto = null;
  photoPrev.className = '';
  photoPrevImg.src = '';
});

/* ===== 表情反应 ===== */
list.addEventListener('click', function(e){
  var b = e.target.closest('.rxb');
  if (!b) return;
  var id = parseInt(b.getAttribute('data-id'), 10);
  var emo = b.getAttribute('data-emo');
  var m = state.msgs.find(function(x){ return x.id === id; });
  if (!m) return;
  if (!m.rx) m.rx = {};
  m.rx[emo] = (m.rx[emo] || 0) + 1;
  saveData().then(render);
});

/* ===== 键盘弹起 ===== */
input.addEventListener('focus', function(){ setTimeout(function(){ render(); }, 320); });
render();
})();
</script>
