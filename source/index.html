<!DOCTYPE html>
<html lang="zh-CN" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080c">
<meta name="color-scheme" content="dark light">
<title>我们的日子</title>
  <link rel="stylesheet" href="./fonts/fonts.css">
<meta name="description" content="从 2026 年 1 月 24 日开始，一天一天数。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23b0646d' d='M12 21s-7.5-4.9-9.3-9.1C1.2 8.4 3.2 5 6.6 5c2 0 3.4 1.1 4.2 2.3L12 9.6l1.2-2.3C14 6.1 15.4 5 17.4 5c3.4 0 5.4 3.4 3.9 6.9C19.5 16.1 12 21 12 21z'/%3E%3C/svg%3E">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --num:"LXGW WenKai Mono","LXGW WenKai",ui-monospace,Menlo,monospace;
  --serif:"LXGW WenKai","Songti SC","Noto Serif SC",Georgia,serif;
  --sans:"LXGW WenKai","LXGW WenKai Mono",-apple-system,"PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;
}
html[data-theme="night"]{
  --bg:#07080c; --bg2:#0c0e14; --panel:#101319; --ink:#f1eee8; --ink2:#a3a09a; --ink3:#6b6862;
  --line:rgba(255,255,255,.10); --edge:rgba(255,255,255,.24); --land:rgba(255,255,255,.075);
  --rose:#e2687360; --rose2:#e26873; --accent:#c8727c; --heart:#d9555f; --moon:#e8e2d4;
  --ring1:#e26873; --ring2:#8b74a8; --glow:0 0 54px 6px rgba(226,104,115,.16);
  --shadow:0 24px 60px -30px rgba(0,0,0,.7); --star:#fff; --starglow:rgba(255,255,255,.42);
  --avring:rgba(255,255,255,.52); --avring2:var(--rose); --haze:rgba(255,255,255,.05);
}
html[data-theme="day"]{
  --bg:#f6f3ed; --bg2:#fffdf9; --panel:#ffffff; --ink:#181c23; --ink2:#5f6570; --ink3:#98a0aa;
  --line:rgba(24,28,35,.10); --edge:rgba(24,28,35,.17); --land:rgba(24,28,35,.045);
  --rose:#c0505c55; --rose2:#b8525e; --accent:#a95763; --heart:#c04a56; --moon:#3a3f49;
  --ring1:#b8525e; --ring2:#7d6494; --glow:0 0 46px 4px rgba(184,82,94,.10);
  --shadow:0 20px 46px -28px rgba(24,28,35,.35); --star:#3a3f49; --starglow:rgba(58,63,73,.18);
  --avring:rgba(24,28,35,.34); --avring2:var(--accent); --haze:rgba(255,170,90,.10);
}
html{background:var(--bg)}
body{
  margin:0;background:
    radial-gradient(120% 80% at 50% -10%,var(--bg2) 0%,var(--bg) 62%);
  color:var(--ink);font-family:var(--sans);font-weight:400;line-height:1.9;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .9s linear,color .9s linear;
}
main{position:relative;z-index:2;max-width:660px;margin:0 auto;padding:0 22px 88px}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55;transition:opacity 2.4s linear;
  background:radial-gradient(90% 60% at 50% 0%,transparent 20%,var(--bg) 100%)}
#cast,#rain,#flash{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
#flash{background:radial-gradient(80% 46% at 50% 6%,rgba(255,255,255,.17),transparent 70%);opacity:0}
#cast i{position:absolute;top:-3px;border-radius:50%;background:var(--star);opacity:0;
  animation:cast var(--d) linear var(--t) infinite}
#cast.stars i{box-shadow:0 0 5px 1px var(--starglow)}
#rain i{position:absolute;top:-14%;width:1px;height:15px;border-radius:1px;opacity:0;
  background:linear-gradient(to bottom,transparent,var(--rose2));animation:drop var(--d) linear var(--t) infinite}
@keyframes cast{0%{opacity:0;transform:translateY(0)}8%{opacity:var(--o)}55%{opacity:var(--o)}100%{opacity:0;transform:translate(var(--x),46vh)}}
@keyframes drop{0%{opacity:0;transform:translateY(0)}6%{opacity:.5}100%{opacity:0;transform:translate(-4vw,112vh)}}
@keyframes br{0%,100%{opacity:.62}50%{opacity:1}}
@keyframes flash{0%,100%{opacity:0}3%{opacity:.6}6%{opacity:.08}9%{opacity:.34}14%{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.13)}24%{transform:scale(.98)}36%{transform:scale(1.07)}}

.top{display:flex;align-items:center;justify-content:space-between;padding:26px 0 0}
.brand{font-family:var(--num);font-size:11px;letter-spacing:.34em;color:var(--ink3)}
#tbtn{display:inline-flex;align-items:center;gap:2px;background:none;border:1px solid var(--line);
  border-radius:999px;padding:6px 10px;cursor:pointer;color:var(--ink2);transition:.4s}
#tbtn:hover{color:var(--ink);border-color:var(--edge)}
#tbtn .ico{width:15px;height:15px;display:none}
html[data-theme="night"] #tbtn .sun{display:block}
html[data-theme="day"] #tbtn .moon{display:block}

.hero{padding:15vh 0 0;text-align:center}
.eyebrow{margin:0;font-family:var(--num);font-size:10.5px;letter-spacing:.3em;color:var(--ink3);text-transform:uppercase}
.big{margin:14px 0 0;font-family:var(--serif);font-weight:400;line-height:.94;
  font-size:clamp(78px,25vw,150px);letter-spacing:-.015em;text-shadow:var(--glow)}
.big .n{font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.big .k{font-size:.3em;color:var(--ink2);letter-spacing:.1em;margin:0 .06em;vertical-align:.6em}
.status{margin:30px 0 0;font-size:12.5px;letter-spacing:.14em;color:var(--ink2)}
.status em{font-style:normal;color:var(--rose2);letter-spacing:.02em;font-family:var(--sans);font-size:13px}
.you{margin:12px 0 0;min-height:1.7em;font-family:var(--num);font-size:11.5px;letter-spacing:.14em;color:var(--ink3)}
.you b{font-weight:400;color:var(--rose2)}
.you .sub{display:block;margin-top:7px;font-size:10.5px;letter-spacing:.12em;color:var(--ink3);opacity:.85}
.you .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin:0 .7em .1em 0;
  background:var(--rose2);box-shadow:0 0 0 3px var(--rose);animation:br 2.6s ease-in-out infinite}
.alive{margin:26px 0 0;font-family:var(--num);font-size:11.5px;letter-spacing:.1em;color:var(--ink3)}
.alive b{font-weight:400;color:var(--ink2);font-variant-numeric:tabular-nums}
.vow{margin:34px 0 0;font-family:var(--serif);font-size:15px;letter-spacing:.06em;color:var(--ink2)}

.map{margin-top:11vh}
.cap{display:flex;justify-content:space-between;align-items:baseline;padding:0 2px 12px;
  font-size:10.5px;letter-spacing:.24em;color:var(--ink3)}
.cap .r{font-family:var(--num);color:var(--rose2);letter-spacing:.1em}
.mapwrap{position:relative;border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:var(--shadow);padding:8px 6px 2px;overflow:hidden}
.map svg{display:block;width:100%;height:auto;overflow:visible}
.grat{fill:none;stroke:var(--edge);stroke-width:.9;stroke-dasharray:3 10;opacity:.6}
.land{fill:var(--land);stroke:var(--edge);stroke-width:1.3;stroke-linejoin:round}
.arc{fill:none;stroke:var(--rose2);stroke-width:1.7;stroke-dasharray:5 6;stroke-linecap:round;opacity:.55;
  animation:march 9s linear infinite}
@keyframes march{to{stroke-dashoffset:-88}}
.av{filter:drop-shadow(0 3px 10px rgba(0,0,0,.5))}
.avring{fill:none;stroke-width:2.2;stroke:var(--avring)}
.av-f .avring{stroke:var(--avring2);stroke-width:2.8;animation:avbreathe 6.5s ease-in-out infinite}
@keyframes avbreathe{0%,100%{stroke-opacity:.72}50%{stroke-opacity:1}}
@media (prefers-reduced-motion:reduce){.av-f .avring{animation:none}}
.halo{fill:var(--rose);animation:br 3.6s ease-in-out infinite}
.cd{fill:none;stroke:var(--rose2);stroke-width:1.6}
.fd{fill:var(--rose2)}
.march{fill:var(--rose2);opacity:.9}
.lab{font-family:var(--sans);font-size:24px;font-weight:400;letter-spacing:.06em;fill:var(--ink2)}
.dist{font-family:var(--num);font-size:22px;letter-spacing:.06em;fill:var(--ink3)}
.wxc{opacity:0;transition:opacity 1.4s linear}
html[data-wx] .wxc{opacity:1}
.city{font-size:25px;letter-spacing:.14em;fill:var(--rose2)}
.wxstate{font-family:var(--sans);font-size:23px;letter-spacing:.1em;fill:var(--ink3)}
.wxf{opacity:0}.flyline{stroke:var(--ink3);stroke-width:1;stroke-dasharray:2 8;opacity:.5}
.flydot{fill:var(--ink2)}.plabel{font-size:23px;letter-spacing:.12em;fill:var(--ink3)}
.heart{fill:var(--heart);filter:url(#hglow);transform-box:fill-box;transform-origin:center;
  animation:beat 4.4s cubic-bezier(.3,.7,.4,1) infinite}
#hglow feDropShadow{flood-color:var(--heart)}

.prog{margin-top:11vh;display:flex;align-items:center;gap:26px}
.ring{position:relative;flex:0 0 auto;width:124px;height:124px}
.ring svg{width:124px;height:124px;transform:rotate(-90deg)}
.trk{fill:none;stroke:var(--line);stroke-width:6}
.bar{fill:none;stroke:url(#rg);stroke-width:6;stroke-linecap:round;
  stroke-dasharray:351.86;stroke-dashoffset:351.86;transition:stroke-dashoffset 1.6s cubic-bezier(.16,1,.3,1)}
.mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.pc{font-family:var(--num);font-size:23px;font-variant-numeric:tabular-nums}
.pc s{text-decoration:none;font-size:11px;color:var(--ink3);margin-left:1px}
.to{font-size:9.5px;letter-spacing:.18em;color:var(--ink3);margin-top:3px}
.pmeta .h{font-size:10.5px;letter-spacing:.24em;color:var(--ink3)}
.pmeta .v{font-family:var(--serif);font-size:17px;margin-top:8px;color:var(--ink)}

.mls{margin-top:9vh;display:grid;gap:0}
.mrow{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:baseline;
  padding:13px 0;border-bottom:1px solid var(--line);font-size:13px}
.mrow .d{font-family:var(--num);font-size:11px;color:var(--ink3);letter-spacing:.08em;min-width:8.4em}
.mrow .n{color:var(--ink2)}
.mrow .c{font-family:var(--num);font-size:10.5px;color:var(--ink3);letter-spacing:.1em}
.mrow.done .n{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--edge)}
.mrow.next .n{color:var(--ink)}
.mrow.next .c{color:var(--rose2)}

.mn{margin-top:6vh;display:flex;gap:4px;justify-content:space-between;align-items:flex-end;
  padding:16px 4px 0;border-top:1px solid var(--line)}
.mn figure{margin:0;text-align:center;flex:1 1 0}
.mn .mi{width:26px;height:26px;margin:0 auto 7px;display:block;color:var(--moon)}
.mn figcaption{font-family:var(--num);font-size:9.5px;letter-spacing:.06em;color:var(--ink3);line-height:1.9}
.mn figcaption b{display:block;font-weight:400;color:var(--ink2)}

.rule{margin:9vh 0 0;border:0;border-top:1px solid var(--line)}
.wish{margin-top:8vh;text-align:center;font-family:var(--serif);font-size:clamp(17px,4.6vw,22px);
  line-height:1.9;letter-spacing:.05em;min-height:3em;color:var(--ink)}
.wish #tw{transition:opacity .7s linear}
.wish .c{display:inline-block;width:.5em;height:1.05em;vertical-align:-.16em;background:var(--rose2);
  opacity:.7;animation:br 1.8s steps(1,end) infinite}
.foot{margin-top:11vh;text-align:center;font-size:11px;letter-spacing:.2em;color:var(--ink3)}
.foot .sig{display:block;margin-top:14px;font-family:var(--num);letter-spacing:.34em;color:var(--ink2)}

html.js .rise{opacity:0;transform:translateY(16px);transition:opacity .85s cubic-bezier(.16,1,.3,1),transform .85s cubic-bezier(.16,1,.3,1)}
html.js .rise.in,html.js .rise.now{opacity:1;transform:none}
html.js .rise.now{transition:none}

html[data-sky="night"] #cast{opacity:1}
html[data-theme="day"] #cast{opacity:.2}
html[data-sky="day"] #cast{opacity:0}
html[data-sky="day"] #sky{opacity:0}
html[data-wx="rain"] .arc,html[data-wx="snow"] .arc{opacity:.4}
html[data-wx="cloud"],html[data-wx="rain"],html[data-wx="snow"],html[data-wx="fog"]{--glow:0 0 44px 4px rgba(150,150,160,.10)}
@media (max-width:520px){
  main{padding:0 18px 70px}
  .prog{flex-direction:column;align-items:flex-start;gap:18px}
  .mrow{grid-template-columns:auto 1fr;font-size:12.5px}
  .mrow .c{grid-column:2;margin-top:2px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  html.js .rise{opacity:1;transform:none}
  #cast,#rain{display:none}
}
html.no-motion #cast,html.no-motion #rain,html.no-motion #flash{display:none}
main{padding-bottom:88px}
#mdock{position:fixed;left:50%;transform:translateX(-50%);bottom:10px;width:min(88vw,420px);z-index:80;border-radius:34px;overflow:hidden;background:rgba(120,124,150,.14);box-shadow:0 8px 28px rgba(0,0,0,.38);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#mdock iframe{display:block;width:100%;height:66px;border:0}
#mcover{position:absolute;left:0;top:0;right:0;bottom:0;z-index:2;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(22,26,44,.94),rgba(10,12,20,.9));color:#e6e3dc;font-size:13px;letter-spacing:2px;cursor:pointer}
#mdock{height:66px}
#dcard{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
#dcover{width:50px;height:50px;border-radius:12px;object-fit:cover;background:#22263a;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.dmeta{display:flex;flex-direction:column;min-width:0;flex:1;gap:2px}
#dtitle{font-size:14px;font-weight:600;color:#f2eee8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dartist{font-size:11px;color:rgba(242,238,232,.62);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dplay{width:34px;height:34px;border-radius:50%;background:#f2eee8;color:#14161c;display:flex;align-items:center;justify-content:center;font-size:12px;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.3)}
#mdock iframe[hidden]{display:none}
#mdock{overflow:hidden}
#dnow{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer}
#dcover2{width:50px;height:50px;border-radius:12px;object-fit:cover;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.35)}
#dnowtitle{font-size:13px;font-weight:600;color:#f2eee8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dbars{display:flex;align-items:flex-end;gap:3px;height:14px;margin-top:3px}
.dbars i{width:3px;height:6px;background:#f2eee8;border-radius:2px;animation:eq 1s ease-in-out infinite}
.dbars i:nth-child(2){animation-delay:.18s}.dbars i:nth-child(3){animation-delay:.36s}.dbars i:nth-child(4){animation-delay:.54s}
.dbars.paused i{animation-play-state:paused;height:4px}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}
#dpp{width:34px;height:34px;border-radius:50%;background:#f2eee8;color:#14161c;display:flex;align-items:center;justify-content:center;font-size:10px;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.3)}
#dprog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(242,238,232,.12)}
#dprog i{display:block;height:100%;width:0;background:#f2eee8;border-radius:0 2px 2px 0;transition:width .3s linear}
.caret{display:inline-block;width:2px;height:1em;background:#f2eee8;margin-left:2px;vertical-align:-2px;animation:blink .9s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* interactive add-ons */
#todaybox{margin:26px auto 0;text-align:center}
#todaybtn{background:none;border:1px solid var(--line);color:var(--ink2);font-family:var(--serif);font-size:12px;letter-spacing:.18em;padding:9px 22px;border-radius:999px;cursor:pointer;transition:color .3s,border-color .3s}
#todaybtn:active{color:var(--ink);border-color:var(--rose2)}
#todaybtn.done{color:var(--ink3);border-color:transparent;letter-spacing:.14em}
#todaycard{max-width:340px;margin:16px auto 0;padding:14px 18px;border:1px solid var(--line);border-radius:14px;background:var(--panel);font-family:var(--serif);font-size:14.5px;color:var(--ink2);letter-spacing:.05em;opacity:0;transform:translateY(8px);transition:opacity .45s,transform .45s;display:none}
#todaycard.show{display:block;opacity:1;transform:translateY(0)}
#mswrap{position:fixed;inset:0;z-index:80;background:rgba(4,5,9,.72);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#mswrap.show{opacity:1;pointer-events:auto}
#mscard{width:min(86vw,360px);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px 24px;transform:translateY(14px) scale(.97);transition:transform .3s}
#mswrap.show #mscard{transform:none}
.mstitle{font-family:var(--num);font-size:11px;letter-spacing:.3em;color:var(--ink3);text-transform:uppercase;text-align:center}
.msrow{display:flex;justify-content:space-between;align-items:baseline;padding:13px 0;border-bottom:1px solid var(--line)}
.msrow:last-of-type{border-bottom:none}
.msrow .md{font-size:15px;color:var(--ink);font-family:var(--serif)}
.msrow .mn2{display:block;font-size:10.5px;color:var(--ink3);letter-spacing:.12em;margin-top:4px}
.msrow .mr{font-size:12px;color:var(--rose2);font-family:var(--num)}
.mshint{margin-top:14px;text-align:center;font-size:10px;letter-spacing:.2em;color:var(--ink3)}
.spark{position:fixed;z-index:99;pointer-events:none;font-size:12px;color:var(--moon);animation:sparkup .95s ease-out forwards;text-shadow:0 0 8px var(--rose)}
.spark.heart{color:var(--rose2)}
@keyframes sparkup{0%{opacity:0;transform:translateY(0) scale(.5)}18%{opacity:1}100%{opacity:0;transform:translateY(-52px) scale(1.2)}}
.wish.skipfx #tw{opacity:.35}

/* sky-tinted palettes (auto, follows her sky) */
html[data-theme="night"][data-sky="dawn"]{
  --bg:#0c0d16; --bg2:#231b2e; --panel:#151728; --ink:#f3efe8; --ink2:#b2aaa0; --ink3:#79726a;
  --line:rgba(255,240,225,.11); --edge:rgba(255,240,225,.24); --land:rgba(255,240,225,.085);
  --rose:#e8926a55; --rose2:#e09a6a; --accent:#d98a5f; --heart:#d97a5f; --moon:#f0dfc0;
  --glow:0 0 54px 6px rgba(224,154,106,.15); --haze:rgba(255,150,90,.13);
  --starglow:rgba(240,226,200,.30);
}
html[data-theme="night"][data-sky="day"]{
  --bg:#dfe8ef; --bg2:#f8fbfd; --panel:#ffffff; --ink:#1b2836; --ink2:#4d5c6b; --ink3:#8494a3;
  --line:rgba(27,40,54,.11); --edge:rgba(27,40,54,.20); --land:rgba(27,40,54,.055);
  --rose:#c0505c55; --rose2:#b8525e; --accent:#a95763; --heart:#c04a56; --moon:#3a3f49;
  --ring1:#b8525e; --ring2:#7d6494; --glow:0 0 46px 4px rgba(184,82,94,.10);
  --shadow:0 20px 46px -28px rgba(27,40,54,.35); --star:#3a3f49; --starglow:rgba(58,63,73,.14);
  --avring:rgba(27,40,54,.34); --haze:rgba(255,186,110,.18);
}
html[data-theme="night"][data-sky="dusk"]{
  --bg:#170c15; --bg2:#3a2032; --panel:#241525; --ink:#f4eef0; --ink2:#bda9b4; --ink3:#7f6f7c;
  --line:rgba(255,235,240,.12); --edge:rgba(255,235,240,.26); --land:rgba(255,235,240,.09);
  --rose:#d4708f55; --rose2:#dd7a8e; --accent:#e08a6e; --heart:#cf5f83; --moon:#f2d7c8;
  --glow:0 0 54px 6px rgba(221,122,142,.17); --haze:rgba(255,124,108,.15);
  --starglow:rgba(250,225,215,.34);
}
html[data-theme="night"][data-sky="night"]{
  --bg:#04060d; --bg2:#0b1022; --panel:#0a0f1a; --moon:#e6ebf5;
  --haze:rgba(80,110,220,.09); --starglow:rgba(205,222,255,.50);
}
html[data-sky] body{transition:background .9s linear,color .9s linear}
/* map: per-city celestial marker (her sky / my sky) */
.cel{cursor:default}
.cel .cbody{fill:var(--moon)}
.cel .cbody.sunb{fill:#e9c46a}
.cel .cbody.dawnb{fill:#e9a06a}
.cel .cbody.duskb{fill:#d98a9f}
.cel .cray{stroke:#e9c46a;stroke-width:1.4;stroke-linecap:round}
.cel .celword{font-family:var(--serif);font-size:21px;letter-spacing:.1em;fill:var(--ink3)}
/* twin-night line */
.you .duo{display:block;margin-top:6px;font-size:11px;letter-spacing:.16em;color:var(--rose2)}
/* meteor */
#meteor{position:fixed;width:2px;height:2px;border-radius:50%;background:#fff;
  box-shadow:0 0 7px 2px rgba(255,255,255,.75);opacity:0;pointer-events:none;z-index:1}
#meteor.go{animation:meteor .9s ease-out 1}
@keyframes meteor{0%{opacity:0;transform:translate(0,0) rotate(35deg)}8%{opacity:.9}
  100%{opacity:0;transform:translate(-40vw,24vh) rotate(35deg)}}

html[data-theme="night"][data-sky="evening"]{
  --bg:#080d1c; --bg2:#172248; --panel:#0f172e; --ink:#f2efe9; --ink2:#b0b0ab; --ink3:#74746e;
  --line:rgba(255,255,255,.12); --edge:rgba(255,255,255,.26); --land:rgba(255,255,255,.09);
  --moon:#eee6cf; --haze:rgba(96,130,225,.14); --starglow:rgba(255,240,210,.34);
}
html[data-sky] body{transition:background .9s linear,color .9s linear}
/* sun / moon arc */
/* 地平线光晕：随天色染色 */
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(130% 46% at 50% -14%,var(--haze,transparent) 0%,transparent 62%)}
/* 太阳/月亮：只在顶部 9-17vh 天区移动，永不进入正文 */
#skyorb{position:fixed;z-index:0;width:34px;height:34px;border-radius:50%;pointer-events:none;left:0;top:0;
  opacity:0;transition:opacity 1.4s linear,background 1.4s linear;
  background:radial-gradient(circle at 42% 38%,#fbe6b0,#e9c46a 58%,rgba(233,196,106,0) 74%);
  box-shadow:0 0 34px 9px rgba(233,196,106,.20)}
html[data-sky="dawn"] #skyorb,html[data-sky="dusk"] #skyorb{
  background:radial-gradient(circle at 42% 38%,#ffd9a8,#e8906a 58%,rgba(232,144,106,0) 74%);
  box-shadow:0 0 34px 9px rgba(232,144,106,.24)}
#skyorb.moon{background:radial-gradient(circle at 46% 42%,#f7f4ea,#d9d5c5 60%,rgba(216,212,196,0) 76%);
  box-shadow:0 0 26px 7px rgba(232,226,212,.14);
  -webkit-mask:radial-gradient(circle at 30% 30%,transparent 0 42%,#000 43%);
  mask:radial-gradient(circle at 30% 30%,transparent 0 42%,#000 43%)}
/* per-city weather fx on the map */
.cityfx .fxr{stroke:var(--rose2);stroke-width:1.6;stroke-linecap:round;opacity:0;
  animation:fxdrop var(--d) linear var(--t) infinite}
.cityfx .fxs{fill:#fff;opacity:0;animation:fxdrop var(--d) linear var(--t) infinite}
.cityfx .fxcl{fill:var(--ink3);opacity:.26;animation:fxdrift 15s ease-in-out infinite alternate}
.cityfx .fxcl.d2{opacity:.18;animation-delay:-7.5s}
.cityfx .fxf{fill:var(--ink3);opacity:.16;animation:fxdrift 9s ease-in-out infinite alternate}
.cityfx .fxc{fill:none;stroke:#e9c46a;stroke-width:1.6;transform-box:fill-box;transform-origin:center;
  animation:fxpulse 3.6s ease-in-out infinite}
.cityfx .fxb{fill:#f0d060;opacity:0;animation:fxflash 5.5s linear infinite}
@keyframes fxdrop{0%{opacity:0;transform:translateY(0)}12%{opacity:.75}100%{opacity:0;transform:translateY(84px)}}
@keyframes fxdrift{from{transform:translateX(-13px)}to{transform:translateX(13px)}}
@keyframes fxpulse{0%,100%{opacity:.14;transform:scale(.88)}50%{opacity:.42;transform:scale(1.1)}}
@keyframes fxflash{0%,88%,96%,100%{opacity:0}91%,94%{opacity:.8}}
.wxc2{opacity:0;transition:opacity 1.4s linear}
html[data-wxm] .wxc2{opacity:1}
.cel .celword{font-size:23px}
